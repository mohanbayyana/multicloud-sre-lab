
name: AWS Networking Terragrunt Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-networking-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Plan AWS Networking
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: live/aws/lab

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "true"
      CI: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: "1.1.6"
          tf_path: terraform

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_NETWORKING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubNetworkingPlan

      - name: Verify AWS account
        run: |
          account_id=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$account_id" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Unexpected AWS account"
            exit 1
          fi

      - name: Initialize remote state
        run: terragrunt run -- init -input=false

      - name: Validate configuration
        run: terragrunt run -- validate

      - name: Generate networking plan
        run: terragrunt run -- plan -input=false -no-color
