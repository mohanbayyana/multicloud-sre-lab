name: Terraform AWS Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/aws/**'
      - 'modules/**'
      - 'live/**'
      - 'bootstrap/**'
      - '.gitignore'
      - '.github/workflows/terraform-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Terraform Format - State Bootstrap
        working-directory: bootstrap/state
        run: terraform fmt -check -recursive

      - name: Terraform Init - State Bootstrap
        working-directory: bootstrap/state
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - State Bootstrap
        working-directory: bootstrap/state
        run: terraform validate

      - name: Terraform Format - Existing Configuration
        working-directory: terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform Init - Existing Configuration
        working-directory: terraform/aws
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Existing Configuration
        working-directory: terraform/aws
        run: terraform validate

      - name: Terraform Format - Networking Module
        working-directory: modules/aws-networking
        run: terraform fmt -check -recursive

      - name: Terraform Init - Networking Module
        working-directory: modules/aws-networking
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Networking Module
        working-directory: modules/aws-networking
        run: terraform validate

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: "1.1.6"
          tf_path: terraform

      - name: Terragrunt Format Check
        working-directory: live/aws
        run: terragrunt hcl fmt --check --diff

      - name: Terragrunt HCL Validate
        working-directory: live/aws/lab
        run: terragrunt hcl validate

      - name: Terragrunt Terraform Validate
        working-directory: live/aws/lab
        run: terragrunt run -- validate
