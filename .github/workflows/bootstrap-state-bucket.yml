name: Bootstrap Terraform State Bucket

on:
  workflow_dispatch:
    inputs:
      confirm_create:
        description: "Choose CREATE to approve the one-time bucket creation"
        required: true
        type: choice
        options:
          - NO
          - CREATE

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state-bucket-bootstrap
  cancel-in-progress: false

jobs:
  create-state-bucket:
    if: github.ref == 'refs/heads/main' && inputs.confirm_create == 'CREATE'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      STATE_BUCKET: multicloud-sre-lab-tfstate-888521354368-us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubStateBootstrap

      - name: Verify AWS account
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          if [ "$account_id" != "888521354368" ]; then
            echo "::error::Unexpected AWS account: $account_id"
            exit 1
          fi


      - name: Ensure bucket exists and inspect state
        id: bootstrap
        shell: bash
        run: |
          set +e
          aws s3api head-bucket \
            --bucket "$STATE_BUCKET" \
            --region "$AWS_REGION" \
            >/tmp/head-bucket.log 2>&1
          bucket_rc=$?
          set -e

          if [ "$bucket_rc" -eq 0 ]; then
            echo "Bucket already exists; checking for interrupted bootstrap."
          elif grep -Eq '404|Not Found|NoSuchBucket' /tmp/head-bucket.log; then
            aws s3api create-bucket \
              --bucket "$STATE_BUCKET" \
              --region "$AWS_REGION"
          else
            cat /tmp/head-bucket.log
            echo "::error::Unable to verify bucket ownership."
            exit 1
          fi

          aws s3api put-bucket-versioning \
            --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$STATE_BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-public-access-block \
            --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          aws s3api put-bucket-ownership-controls \
            --bucket "$STATE_BUCKET" \
            --ownership-controls 'Rules=[{ObjectOwnership=BucketOwnerEnforced}]'

          set +e
          aws s3api head-object \
            --bucket "$STATE_BUCKET" \
            --key bootstrap/state/terraform.tfstate \
            --region "$AWS_REGION" \
            >/tmp/state-head.log 2>&1
          state_rc=$?
          set -e

          if [ "$state_rc" -eq 0 ]; then
            echo "state_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' /tmp/state-head.log; then
            echo "state_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/state-head.log
            echo "::error::Unable to verify remote state."
            exit 1
          fi

      - name: Terraform Format Check
        run: terraform -chdir=bootstrap/state fmt -check -recursive

      - name: Initialize Terraform with S3 backend
        run: terraform -chdir=bootstrap/state init -input=false

      - name: Import existing bucket into remote state
        if: steps.bootstrap.outputs.state_exists == 'false'
        run: |
          terraform -chdir=bootstrap/state import \
            -input=false \
            aws_s3_bucket.state \
            "$STATE_BUCKET"

      - name: Create and review plan
        run: |
          terraform -chdir=bootstrap/state plan \
            -input=false -out=tfplan
          terraform -chdir=bootstrap/state show -no-color tfplan

      - name: Apply approved workflow plan
        run: terraform -chdir=bootstrap/state apply -input=false -auto-approve tfplan

      - name: Verify remote state
        run: |
          terraform -chdir=bootstrap/state state list
          aws s3api head-object \
            --bucket "$STATE_BUCKET" \
            --key bootstrap/state/terraform.tfstate \
            --region "$AWS_REGION"
